<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PyDomus{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'account/style.css' %}">
</head>
<body>

        <img src="{% static 'images/logo.jpeg' %}" alt="Logo PyDomus" class="navbar-logo">
        <span class="navbar-title">PyDomus</span>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
