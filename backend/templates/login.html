{% extends 'base.html' %}
{% load static %}

{% block title %}Connexion | PyDomus{% endblock %}

{% block content %}
    <nav class="navbar-login">
        <img src="{% static 'images/logo.jpeg' %}" alt="Logo PyDomus" class="navbar-logo">
        <span class="navbar-title">PyDomus</span>
    </nav>
    <main class="page">
        <section class="login-area" aria-labelledby="login-title">
            <div class="login-card">
                <h2 id="login-title">Bienvenue</h2>
                <p class="intro">Connectez-vous pour acceder a votre tableau de bord.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form }}
                    <button type="submit">Se connecter</button>
                </form>
                <p class="register-link">Vous n'avez pas de compte ? <a href="{% url 'register' %}">Inscrivez-vous</a></p>
            </div>
        </section>
    </main>
{% endblock %}
